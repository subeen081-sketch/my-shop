<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<div style="font-family: var(--font-sans); color: var(--ink); padding: 24px; word-break: keep-all">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
  <button type="button" style="height: 60px; padding: 0 40px; border: 0; border-radius: var(--radius-pill); background: var(--rose-500); color: var(--on-rose); font: 600 18px var(--font-sans); display: flex; align-items: center; gap: 10px">진단 시작하기<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5 15.5 10 11 14.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button type="button" style="height: 52px; padding: 0 28px; border: 1px solid var(--line-200); border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font: 600 16px var(--font-sans)">공유하기</button>
  <button type="button" style="height: 52px; padding: 0 12px; border: 0; background: transparent; color: var(--ink); font: 500 16px var(--font-sans); text-decoration: underline; text-underline-offset: 4px">이전</button>
  <button type="button" disabled style="height: 52px; padding: 0 36px; border: 0; border-radius: var(--radius-pill); background: var(--line-100); color: var(--ink-subtle); font: 600 16px var(--font-sans)">다음</button>
</div>
</div>
