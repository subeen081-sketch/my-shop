<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&amp;display=swap">
<div style="position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--page-top); font-family: var(--font-sans)">
  <style>
    .c-rose{fill:var(--rose-500)} .c-ink{fill:var(--ink)} .c-berry{fill:var(--lip-berry)} .c-blush{fill:var(--blush-200)} .c-peach{fill:var(--lip-peach)} .c-surface{fill:var(--surface)}
    .r-lg{rx:var(--radius-lg)}
  </style>
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true" style="position: absolute; inset: 0">
    <!-- blocks: rose-500 200x220, ink 120x168, lip-berry 104x268 (bleeds top/right), blush-200 352x104 (bleeds bottom), lip-peach disc r48 -->
    <!-- arrangement: one tall rose slab with satellites, staggered, bleeding off the top, right and bottom edges, all right of x=480 -->
    <!-- pattern: discs and pills (radius-pill) — "soft, friendly, large radii": the brand's buttons, chips and badges are all pills -->
    <!-- steps: space-4 16px gaps, radius-lg 20px corners, pills rx = half the short side (12px), disc pitch space-6 24px -->
    <rect class="c-rose r-lg" x="512" y="-20" width="200" height="220"></rect>
    <rect class="c-ink r-lg" x="728" y="-20" width="120" height="168"></rect>
    <rect class="c-berry r-lg" x="864" y="-20" width="116" height="268"></rect>
    <rect class="c-blush r-lg" x="512" y="216" width="352" height="104"></rect>
    <circle class="c-peach" cx="788" cy="204" r="40"></circle>
    <rect class="c-surface" x="536" y="40" width="96" height="24" rx="12"></rect>
    <rect class="c-surface" x="536" y="80" width="152" height="24" rx="12"></rect>
    <rect class="c-surface" x="536" y="120" width="64" height="24" rx="12"></rect>
    <circle class="c-rose" cx="548" cy="252" r="12"></circle>
    <circle class="c-rose" cx="584" cy="252" r="12"></circle>
    <circle class="c-rose" cx="620" cy="252" r="12"></circle>
    <circle class="c-berry" cx="656" cy="252" r="12"></circle>
  </svg>
  <div style="position: absolute; left: 40px; bottom: 36px; max-width: 440px">
    <div style="font-size: 64px; line-height: .95; font-weight: 700; letter-spacing: -0.02em; color: var(--ink)">립핏<br>디자인 시스템</div>
    <div style="margin-top: 16px; font-size: 14px; color: var(--ink-muted)">화사하되 립 색을 가리지 않는, 친근한 진단형 립 브랜드</div>
  </div>
</div>
