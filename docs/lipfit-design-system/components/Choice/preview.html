<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<div style="font-family: var(--font-sans); color: var(--ink); padding: 24px; word-break: keep-all">
<div role="radiogroup" aria-label="연령대" style="max-width: 480px; display: flex; flex-direction: column; gap: 12px">
  <button type="button" role="radio" aria-checked="false" style="height: 64px; padding: 0 24px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: 500 18px var(--font-sans); text-align: left">10대</button>
  <button type="button" role="radio" aria-checked="true" style="height: 64px; padding: 0 24px; border: 1px solid var(--rose-500); border-radius: var(--radius-md); background: var(--rose-500); color: var(--on-rose); font: 600 18px var(--font-sans); display: flex; align-items: center; justify-content: space-between">20대<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" style="fill: var(--surface)"></circle><path d="M6.5 11.2l3 3 6-6.2" style="stroke: var(--rose-500)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button type="button" role="radio" aria-checked="false" style="height: 64px; padding: 0 24px; border: 1px solid var(--line-300); border-radius: var(--radius-md); background: var(--page-mid); color: var(--ink); font: 500 18px var(--font-sans); text-align: left">30대 (호버)</button>
</div>
</div>
